<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width,
initial-scale=1.0">
<title>web</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1 id="mainTitle">testing</h1>
    <p id="subtitle">
        Learning
    </p>
    <button id="themeButton">
        🌙 Dark Mode
    </button>
</header>
<main>
    <section class="card">
        <h2>Profile</h2>
        <img
        id="profileImage"
        class="round-image"
        src="https://i.pinimg.com/736x/29/06/49/29064960c2b0e3b0ab3fa1e9005ee971.jpg"
        alt="Profile Picture"
        >
        <h3 id="profileName">yzlash</h3>
        <input id="changeName" placeholder="Change name...">
        <br><br>
        <input type="file" id="imageInput" accept="image/*">
        <br><br>
        <button id="changeProfileButton">Update Profile</button>

    </section>
    <section class="cardChat">
       <ul id="chatMessages">
      
       </ul>
<br><br>

<div class="chatInput">

<input id="textBox" placeholder="Message...">
<button id="sendButton">
    Send
</button>

</div>

    </section>

</main>
<footer>
<p>
    Made by yzlash
</p>
</footer>

<script src="script.js"></script>

</body>
</html>
